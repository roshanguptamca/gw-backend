<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ report_title }}</title>
    <style>
        @page {
            size: A4;
            margin: 18mm 12mm 18mm 12mm;
            @bottom-center {
                content: "Generated by SecureWise • " counter(page) " of " counter(pages);
                color: #64748b;
                font-size: 10px;
            }
        }
        body {
            color: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
        }
        .header {
            background: linear-gradient(90deg, #0f172a, #1e293b);
            color: #f8fafc;
            padding: 18px 24px;
            margin-bottom: 24px;
        }
        .brand {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.03em;
        }
        .subtitle {
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 4px;
        }
        .section {
            margin: 0 24px 24px;
        }
        .section h2 {
            border-bottom: 2px solid #e2e8f0;
            font-size: 16px;
            margin: 0 0 12px;
            padding-bottom: 6px;
        }
        .meta-grid {
            display: grid;
            gap: 8px 16px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .meta-label {
            color: #475569;
            display: block;
            font-size: 11px;
            text-transform: uppercase;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #dbe2ea;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background: #f8fafc;
            font-size: 11px;
            text-transform: uppercase;
        }
        .badge {
            border-radius: 999px;
            color: #fff;
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            text-transform: uppercase;
        }
        .severity-critical { background: #b91c1c; }
        .severity-high { background: #ea580c; }
        .severity-medium { background: #ca8a04; color: #111827; }
        .severity-low { background: #2563eb; }
        .severity-info { background: #6b7280; }
        .banner {
            border-radius: 8px;
            font-weight: 600;
            padding: 10px 14px;
        }
        .banner-pass {
            background: #dcfce7;
            color: #166534;
        }
        .banner-fail {
            background: #fee2e2;
            color: #991b1b;
        }
        .footer-note {
            color: #64748b;
            font-size: 11px;
            margin: 12px 24px 0;
        }
        .muted {
            color: #64748b;
        }
        .code {
            background: #f8fafc;
            border: 1px solid #dbe2ea;
            border-radius: 6px;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 11px;
            padding: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">🛡️ SecureWise</div>
        <div class="subtitle">{{ report_title }}{% if generated_at %} • Generated {{ generated_at }}{% endif %}</div>
    </div>
    {% block content %}{% endblock %}
    <div class="footer-note">Generated by SecureWise{% if generated_at %} • {{ generated_at }}{% endif %}</div>
</body>
</html>
