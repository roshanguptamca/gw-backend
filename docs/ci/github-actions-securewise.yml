name: SecureWise Scan

on:
  push:
  pull_request:

jobs:
  securewise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare database
        run: python manage.py migrate --noinput

      - name: Run SecureWise local scan
        run: python -m apps.securewise.cli scan --path . --output securewise-report --fail-on high

      - name: Upload SecureWise reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: securewise-report
          path: securewise-report/
