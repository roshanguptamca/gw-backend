services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: gw-db
    environment:
      POSTGRES_DB: guidewisey
      POSTGRES_USER: guidewisey
      POSTGRES_PASSWORD: guidewisey
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guidewisey"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django API ───────────────────────────────────────────────────────────────
  web:
    build: .
    container_name: gw-backend-web
    command: gunicorn guidewisey.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # ── FutureWise Scheduler (APScheduler — DB-backed, no Redis) ────────────────
  scheduler:
    build: .
    container_name: gw-scheduler
    command: ./scheduler_entrypoint.sh
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  pg_data:
