  #     - key: DB_PORT
  #       fromDatabase:
  #         name: gw-db
  #         property: port
  #     - key: DB_NAME
  #       fromDatabase:
  #         name: gw-db
  #         property: database
  #     - key: DB_USER
  #       fromDatabase:
  #         name: gw-db
  #         property: user
  #     - key: DB_PASSWORD
  #       fromDatabase:
