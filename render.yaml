# render.yaml — GuideWisey Backend on Render
# Defines the web API service and the background scheduler worker.
# https://render.com/docs/infrastructure-as-code

services:
  # ── Web API (Django + Gunicorn) ──────────────────────────────────────────────
  - type: web
    name: gw-backend
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: >
      gunicorn guidewisey.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers ${WEB_CONCURRENCY:-2}
      --timeout ${GUNICORN_TIMEOUT:-120}
      --log-level info
    healthCheckPath: /api/accounts/session/
    envVars:
      - key: ENV
        value: PROD
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: api.guidewisey.com,guidewisey.com,www.guidewisey.com,gw-backend-eq2n.onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://api.guidewisey.com,https://guidewisey.com,https://www.guidewisey.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://guidewisey.com,https://www.guidewisey.com,https://gw-frontend.onrender.com
      - key: FILE_STORAGE_BACKEND
        value: auto   # uses S3 if AWS vars set, else DB
      # Database — link to a Render PostgreSQL instance
      - key: DB_ENGINE
        value: postgresql
      - key: DB_HOST
        fromDatabase:
          name: gw-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gw-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gw-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gw-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gw-db
          property: password
      # Set these as secret env vars in the Render dashboard:
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: eu-west-1
      - key: S3_BUCKET
        sync: false
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_SENDER_EMAIL
        value: noreply@guidewisey.com
      - key: EMAIL_SENDER_NAME
        value: FutureWise by GuideWisey
      - key: FUTUREWAVE_FRONTEND_BASE_URL
        value: https://guidewisey.com
      - key: FRONTEND_AUTH_SUCCESS_URL
        value: https://www.guidewisey.com/auth-callback?status=success
      - key: FRONTEND_AUTH_ERROR_URL
        value: https://www.guidewisey.com/auth-callback?error=
      - key: SPEAKING_BUDDY_MODEL
        value: gpt-4o-mini
      - key: SPEAKING_BUDDY_MAX_AVATAR_BYTES
        value: "5242880"

  # ── Background Scheduler (FutureWise reminder dispatch) ──────────────────────
  # The APScheduler runs as a background thread inside the web service process
  # (started via AppConfig.ready()) — no separate paid Worker service needed.
  #
  # If you upgrade to a paid plan and want a dedicated scheduler process, uncomment:
  #
  # - type: worker
  #   name: gw-scheduler
  #   runtime: python
  #   region: frankfurt
